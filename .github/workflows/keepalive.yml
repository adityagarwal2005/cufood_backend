name: Keep backend awake

# Render's free tier spins the service down after a period of no traffic,
# and the next request has to cold-start it — which is what was causing
# UptimeRobot's checks to intermittently 500 (multiple regions hitting it
# at once while it's mid-boot). A ping well inside Render's idle timeout
# keeps it warm so that never happens.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf --max-time 30 https://cufood-backend.onrender.com/api/locations/ > /dev/null
