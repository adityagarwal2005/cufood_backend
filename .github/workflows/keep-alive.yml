name: Keep backend awake

# Render's free tier spins the backend down after ~15 min of no traffic,
# so the first request after a gap takes 30-60s to wake it back up. This
# pings the live backend every 10 minutes — comfortably under that
# timeout — so it never goes idle long enough to sleep.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sf --max-time 20 https://cufood-backend.onrender.com/api/csrf/ \
            && echo "Backend responded OK" \
            || echo "Ping failed (backend may have been asleep or slow to respond) — not treated as a workflow failure"
